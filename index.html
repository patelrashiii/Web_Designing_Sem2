<!DOCTYPE html>
<html>
<head>
    <title>Sum of Even Numbers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 10px;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sum of Even Numbers</h2>

        <label>Enter a number:</label>
        <input type="number" id="num">

        <button onclick="calculateSum()">Find Sum</button>

        <h3 id="result"></h3>
    </div>

    <script>
        function calculateSum() {
            let n = document.getElementById("num").value;
            let sum = 0;

            for (let i = 1; i <= n; i++) {
                if (i % 2 == 0) {
                    sum = sum + i;
                }
            }

            document.getElementById("result").innerHTML =
                "Sum of even numbers from 1 to " + n + " is: " + sum;
        }
    </script>

</body>
</html>
